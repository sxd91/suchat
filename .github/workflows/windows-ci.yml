name: Windows CI

on:
  push:
    branches: [main]
    tags: ["windows-v*"]
    paths: ["apps/suchat_windows/**", ".github/workflows/windows-ci.yml"]
  pull_request:
    paths: ["apps/suchat_windows/**", ".github/workflows/windows-ci.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Build Windows desktop app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/suchat_windows
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: suchat-windows-release
          path: apps/suchat_windows/build/windows/x64/runner/Release
          if-no-files-found: error

  release:
    name: Publish Windows release
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/suchat_windows
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package release archive
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../../suchat-windows-release.zip
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: suchat-windows-release.zip
          generate_release_notes: true
