[versions]
agp = "9.3.1"
kotlin = "2.4.10"
compose-bom = "2026.08.00"
compose-material3 = "1.5.0-alpha26"
activity = "1.13.0"
androidx-core-ktx = "1.19.0"
lifecycle-runtime = "2.11.0"
miuix = "0.9.4-rc01"
materialkolor = "5.0.0"
serialization = "1.11.0"
# 既有数据层依赖（保留）
coroutines = "1.9.0"
datastore = "1.1.2"
# Kyant backdrop（液态玻璃上游库；用户指定 https://github.com/Kyant0/AndroidLiquidGlass）
kyant-backdrop = "2.0.1"
kyant-shapes = "1.2.1"

[libraries]
# --- Compose ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle-runtime" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-runtime" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

# --- miuix（LiquidGlass 悬浮底栏 + miuix 组件） ---
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur-android", version.ref = "miuix" }
miuix-shader = { module = "top.yukonga.miuix.kmp:miuix-shader-android", version.ref = "miuix" }
miuix-nav = { module = "top.yukonga.miuix.kmp:miuix-nav-android", version.ref = "miuix" }
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons-android", version.ref = "miuix" }

# --- material-kolor（莫奈取色） ---
materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialkolor" }

# --- kotlinx-serialization ---
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# --- kyant backdrop（液态玻璃上游库） ---
# 用户指定：https://github.com/Kyant0/AndroidLiquidGlass
#  · 官方文档：https://kyant.gitbook.io/backdrop
#  · 效果基于 RenderEffect → Android 12+；含 RuntimeShader 的效果需 Android 13+
#    （本项目 minSdk = 33，全覆盖）
#  · 效果顺序固定：colorFilter ⇒ blur ⇒ lens
#  · 库不提供高层组件，只提供 Backdrop 能力 + drawBackdrop 修饰符
kyant-backdrop = { module = "io.github.kyant0:backdrop", version.ref = "kyant-backdrop" }
# ContinuousCapsule / Capsule 等连续圆角形状（lens 要求 shape 是 CornerBasedShape）
kyant-shapes = { module = "io.github.kyant0:shapes", version.ref = "kyant-shapes" }

# --- 既有数据层依赖（保留：SessionStore / ApiClient 在用） ---
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
